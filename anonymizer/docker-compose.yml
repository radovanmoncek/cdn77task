version: '3'
services:
  zookeeper:
    platform: linux/x86_64
    image: confluentinc/cp-zookeeper:7.1.0
    hostname: zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    env_file: ".env"

  broker:
    image: confluentinc/cp-kafka:7.1.0
    hostname: broker
    container_name: broker
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9101:9101"
    env_file: ".env"
  
  grafana:
    image: "grafana/grafana:8.4.5"
    ports:
     - "3000:3000"
    #command: "/bin/bash -c grafana-cli plugins install grafana-clickhouse-datasource"
    volumes:
     - ./grafana/provisioning:/etc/grafana/provisioning
     - ./grafana/dashboards:/var/lib/grafana/dashboards
    container_name: grafana
    depends_on:
     - prometheus
    env_file: .env

  prometheus:
    image: "prom/prometheus:v2.34.0"
    ports:
     - "9090:9090"
    volumes:
     - ./etc/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command: "--config.file=/etc/prometheus/prometheus.yml"
    container_name: prometheus
    env_file: ".env"

  jmx-kafka:
    platform: linux/x86_64
    image: "sscaling/jmx-prometheus-exporter"
    ports:
     - "5556:5556"
    volumes:
     - ./etc/jmx_exporter/config_kafka.yml:/etc/jmx_exporter/config.yml
    container_name: jmx-kafka
    depends_on:
     - broker
    env_file: ".env"

  kafka-ui:
    image: provectuslabs/kafka-ui:master
    container_name: kafka-ui
    ports:
      - "4000:8080"
    #restart: always 
    depends_on:
      - broker
    env_file: ".env"

  clickhouse-server:
    image: yandex/clickhouse-server
    ports:
      - "8123:8123"
      - "9000:9000"
      - "9009:9009"
    ulimits:
      nproc: 65535
      nofile:
        soft: 262144
        hard: 262144
    container_name: clickhouse
    env_file: ".env"

  ch-proxy:
    build: docker/ch-proxy
    ports:
      - 8124:8124
    #restart: always
    depends_on:
      - clickhouse-server
    container_name: ch-proxy
    env_file: ".env"

  http-log-kafka-producer:
    build: docker/http-log-kafka-producer
    platform: linux/amd64
    #restart: always
    depends_on:
      - broker
    container_name: log-producer
    env_file: ".env"
  #https://geshan.com.np/blog/2022/01/redis-docker/ 
  cache:
    image: redis:6.2-alpine
    #restart: always
    ports:
      - '6379:6379'
    command: redis-server --save 20 1 --loglevel warning --requirepass eYVX7EwVmmxKPCDmwMtyKVge8oLd2t81
    volumes:
      - cache:/data
    env_file: ".env"

volumes:
  cache:
    driver: local
